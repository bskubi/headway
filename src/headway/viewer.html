<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --border: #d6d3cc; --grid: #ece9e2;
  --accent: #2f5fd0; --accent-soft: #e5ecfb; --edge: #9a978f;
  --input: #2f7d6d; --input-bg: #e3f2ee; --value: #4a4a50; --value-bg: #ffffff;
  --output: #8a4fbf; --output-bg: #f1e8fa; --setting: #a8650b; --setting-bg: #fbf0dd; --constant: #69707c; --constant-bg: #eef0f3;
  --op-bg: #f3f1ec; --group-bg: rgba(47, 95, 208, 0.035); --ok: #23863a; --bad: #c4352b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #1f1f23; --fg: #e8e6e1; --muted: #9b9a96; --border: #3a3a40; --grid: #26262b;
    --accent: #7ea2ff; --accent-soft: #263255; --edge: #6d6c69;
    --input: #6cc4b0; --input-bg: #1c302b; --value: #d4d2cc; --value-bg: #232328;
    --output: #c39af0; --output-bg: #2c2238; --setting: #e4aa55; --setting-bg: #33281a; --constant: #a3abb8; --constant-bg: #272a30;
    --op-bg: #2a2a2f; --group-bg: rgba(126, 162, 255, 0.05); --ok: #5cc173; --bad: #f07167;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header, #checks { flex: none; }
header { padding: 8px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 6px 24px; align-items: center; }
header .hl { flex: 1; min-width: 0; }
header .tline { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
#meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#home { font-size: 16px; color: var(--accent); text-decoration: none; padding: 0 2px; }
#home:hover { color: var(--fg); }
.noresults { max-width: 640px; padding: 24px 20px; line-height: 1.5; }
.noresults p { margin: 0 0 10px; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
header .desc { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .desc.full { white-space: normal; max-width: 110ch; }
header .desc.clip, header .desc.full { cursor: pointer; }
.toolbar { display: flex; gap: 6px; align-items: center; flex: none; }
#gbar { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px 14px; pointer-events: none; }
#gbar .grp { display: inline-flex; gap: 4px; align-items: center; pointer-events: auto; }
#gbar .grp:empty { display: none; }
#gbar button, #gbar .seg label, #gbar label.seg, #gbar details.menu > summary { font-size: 12px; padding: 3px 8px; }
#gbar details.menu > div { left: 0; right: auto; }
#gbar .zoom { display: inline-flex; }
#gbar .zoom button { min-width: 26px; padding: 3px 0; font-weight: 600; }
#gbar .zoom button:first-child { border-radius: 6px 0 0 6px; }
#gbar .zoom button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.mbtns { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
.mbtns [hidden] { display: none; }
button, .seg label, details.menu > summary {
  font: inherit; font-size: 12.5px; color: var(--fg); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 9px; cursor: pointer; user-select: none;
}
button:hover, details.menu > summary:hover { border-color: var(--accent); }
.seg { display: inline-flex; }
.seg label { border-radius: 0; margin-left: -1px; }
.seg label:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg label:last-child { border-radius: 0 6px 6px 0; }
.seg input { display: none; }
label.seg { font-size: 12.5px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; cursor: pointer; background: var(--panel); user-select: none; }
label.seg:hover { border-color: var(--accent); }
.seg input:checked + span { color: var(--accent); font-weight: 600; }
label.seg > span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px;
  border: 1.5px solid var(--muted); border-radius: 2px; }
label.seg > input:checked + span::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--panel); }
details.menu { position: relative; }
details.menu > summary { list-style: none; }
details.menu > div { position: absolute; right: 0; z-index: 10; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; min-width: 220px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
details.menu label { display: block; padding: 2px 0; white-space: nowrap; font-size: 13px; }
.checks { margin: 0 20px; padding: 8px 12px; border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; margin-top: 10px; font-size: 13px; }
.checks summary { cursor: pointer; margin-top: 4px; color: var(--muted); }
.checks pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--fg); }

#work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.top { flex: 1; display: flex; min-height: 0; }
#graph { flex: 1; position: relative; overflow: hidden; background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 18px 18px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#graph.panning { cursor: grabbing; }
#graph svg { width: 100%; height: 100%; display: block; }
#note { position: absolute; left: 12px; bottom: 30px; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; background: var(--panel);
  border: 1px solid var(--accent); pointer-events: none; opacity: 0; transition: opacity .4s; }
#note.on { opacity: 1; transition: none; }
#note { z-index: 4; }
.node.new .n { animation: flash 1.6s ease-out 2; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 5px var(--accent); } }
#hint { position: absolute; left: 12px; right: 12px; bottom: 8px; color: var(--muted); font-size: 12px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#detail { flex: none; width: min(var(--detail-w, 460px), calc(100vw - 200px)); background: var(--panel); overflow: auto; padding: 16px 18px; }
/* dividers: drag to resize, drag (almost) shut or double-click or ‹ › to collapse, as in an editor */
.split { flex: none; position: relative; z-index: 3; background: var(--border); touch-action: none; }
.split.v { width: 1px; cursor: col-resize; }
.split.h { height: 1px; cursor: row-resize; }
.split::before { content: ""; position: absolute; inset: 0 -4px; }
.split.h::before { inset: -4px 0; }
.split:hover, .split.drag { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.split button { position: absolute; padding: 0; font-size: 11px; line-height: 1; color: var(--muted); opacity: 0; transition: opacity .15s; pointer-events: none; }
.split:hover button, .split button:focus-visible, .shut button { opacity: 1; pointer-events: auto; }   /* hidden, it must not take clicks */
.split.v button { top: 50%; left: -8px; width: 16px; height: 34px; transform: translateY(-50%); }
.split.h button { left: 50%; top: -8px; width: 34px; height: 16px; transform: translateX(-50%); }
body.nodetail #detail, body.nolegend #legend { display: none; }
#detail .empty { color: var(--muted); }
#detail .decl { font-size: 12px; margin: -2px 0 8px; }
#detail .decl a { color: var(--muted); text-decoration: none; }
#detail .decl a:hover { color: var(--accent); text-decoration: underline; }
#live { font-size: 12px; color: var(--muted); }
#live.on::before { content: "●"; color: var(--ok); margin-right: 4px; }
#live.off::before { content: "●"; color: var(--bad); margin-right: 4px; }
@media (max-width: 760px) {
  body { height: auto; overflow: visible; display: block; }
  .top { flex-direction: column; height: auto; }
  #graph { height: 62vh; flex: none; }
  #detail, body.nodetail #detail { display: block; width: auto; border-top: 1px solid var(--border); }
  #legend, body.nolegend #legend { display: grid; height: auto; }
  .split { display: none; }
}

/* nodes */
.n { font-size: 13px; border: 1.5px solid var(--border); border-radius: 7px; padding: 5px 10px; background: var(--value-bg); white-space: nowrap; display: inline-block; cursor: pointer; }
.n .katex { font-size: 1.12em; }
.n.sym { border-radius: 999px; text-align: center; padding: 4px 13px 3px; }
.n.sym .dims { color: var(--muted); font-size: 10.5px; line-height: 1.2; }
.n.sym .dims .katex { font-size: 1em; }
.n.role-input { border-color: var(--input); background: var(--input-bg); }
.n.role-output { border-color: var(--output); background: var(--output-bg); }
.n.role-setting { border-color: var(--setting); background: var(--setting-bg); border-style: dashed; }
.n.role-constant { border-color: var(--constant); background: var(--constant-bg); border-style: dotted; border-width: 2px; }
.n.op { background: var(--op-bg); border-color: var(--edge); border-radius: 4px; font-weight: 560; }
.n.op .ok { color: var(--ok); font-weight: 700; margin-left: 5px; }
.n.op .bad { color: var(--bad); font-weight: 700; margin-left: 5px; }
.n.op .per, .n.cg .per { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
.n.cg { background: var(--group-bg); border: 1.5px solid var(--accent); border-radius: 8px; font-weight: 600; color: var(--accent); }
.n.cg .sub { font-weight: 400; color: var(--muted); font-size: 11px; }
.n.stack { box-shadow: 3px 3px 0 -1.5px var(--bg), 3px 3px 0 0 var(--edge), 6px 6px 0 -1.5px var(--bg), 6px 6px 0 0 var(--edge); }
.node.sel .n { outline: 2.5px solid var(--accent); outline-offset: 2px; }
/* a stack is outlined as a whole, around the cards behind it too */
.node.sel .n.stack { outline: none; position: relative; }
.node.sel .n.stack::after { content: ""; position: absolute; inset: -6px -12px -12px -6px; border: 2.5px solid var(--accent); border-radius: 9px; pointer-events: none; }
.node.sel .n.stack.sym::after { border-radius: 999px; }
.node.dim, .edge.dim { opacity: 0.28; }
.edge path { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.edge.hl path { stroke: var(--accent); stroke-width: 2; }
.grp rect { fill: var(--group-bg); stroke: var(--border); stroke-width: 1.2; rx: 10; }
.grp.sel rect { stroke: var(--accent); stroke-width: 2; }
.grp .head { font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: 0.02em; display: flex; gap: 6px; align-items: center; padding: 5px 9px; cursor: pointer; white-space: nowrap; }
.grp .head .tog { border: 1px solid var(--border); border-radius: 4px; width: 16px; height: 16px; line-height: 13px; text-align: center; font-size: 13px; color: var(--fg); background: var(--panel); }
#measure { position: absolute; left: -10000px; top: 0; visibility: hidden; }

/* detail */
#detail h2 { font-size: 17px; margin: 0 0 2px; }
.pen { color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 400; margin-left: 6px; opacity: .55; text-transform: none; letter-spacing: 0; }
.pen:hover { color: var(--accent); opacity: 1; }
#legend .pen { opacity: 0; }
#legend tr:hover .pen, #legend .eqrow:hover .pen, #legend .pen:focus { opacity: .8; }
#detail .eq { position: relative; }
#detail .eq .pen { position: absolute; top: 4px; right: 6px; }
#detail .askmode { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin: 0 0 8px; }
#detail .askmode button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12.5px; background: var(--panel); }
#detail .askmode button + button { border-left: 1px solid var(--border); }
#detail .askmode button.on, #detail .formats button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#detail .formats { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
#detail .formats button { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); }
#detail .presets { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 6px; }
#detail .presets button { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); }
#detail .ask textarea { width: 100%; min-height: 4.5em; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; resize: vertical; }
#detail .ask textarea:focus { outline: none; border-color: var(--accent); }
#detail .ask .row { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
#detail .ask button { white-space: nowrap; }
#detail .ask details pre { white-space: pre-wrap; font-size: 11.5px; max-height: 22em; overflow: auto; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; color: var(--fg); }
#detail .crumb { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
#detail .eq .katex-display { font-size: 0.92em; }
#detail .eq { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; overflow-x: auto; margin: 10px 0; }
#detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; cursor: pointer; background: var(--bg); font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.chip.op { border-radius: 4px; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.status { font-size: 13px; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
.status pre { white-space: pre-wrap; color: var(--fg); font-size: 11.5px; }
.code { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0 12px; overflow: hidden; }
.code .where { display: flex; justify-content: space-between; gap: 8px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 5px 10px; border-bottom: 1px solid var(--border); background: var(--bg); }
.code .where a { color: var(--accent); text-decoration: none; white-space: nowrap; }
.code .where .missing { color: var(--bad); }
.code pre { margin: 0; padding: 8px 0; overflow-x: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); }
.code .ln { display: inline-block; width: 3.6em; padding-right: 0.9em; text-align: right; color: var(--muted); user-select: none; opacity: .7; }
.code code.hljs { background: transparent; padding: 0; }

/* legend */
#legend { flex: none; height: min(var(--legend-h, 36vh), calc(100vh - 260px)); overflow: auto; padding: 4px 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 8px 36px; }
@media (max-width: 1000px) { #legend { grid-template-columns: minmax(0, 1fr); } }
#legend h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 18px 0 8px; font-weight: 650; }
#legend table { border-collapse: collapse; width: 100%; }
#legend td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; }
#legend td.tex { white-space: nowrap; width: 1%; }
#legend td.shape { white-space: nowrap; width: 1%; color: var(--muted); }
#legend td .name { font-weight: 560; }
#legend td .d { color: var(--muted); font-size: 13px; }
#legend tr, .eqrow { cursor: pointer; }
#legend tr:hover td, .eqrow:hover { background: var(--accent-soft); }
#legend tr.hl td, .eqrow.hl { background: var(--accent-soft); }
#legend tr.sel td, .eqrow.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
#legend tr.sel td + td { box-shadow: none; }
.rolehead td { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 12px !important; cursor: default; }
.eqgroup { font-size: 12px; font-weight: 650; color: var(--muted); margin: 14px 0 4px; letter-spacing: .02em; }
.eqrow { border-top: 1px solid var(--border); padding: 6px 8px; display: grid; grid-template-columns: 11em minmax(0, 1fr) 1.2em; gap: 12px; align-items: baseline; }
#legend .act { width: 1%; text-align: right; } #legend .act .pen { margin-left: 0; }
.eqrow .lbl { font-weight: 560; }
.eqrow .lbl .ok { color: var(--ok); } .eqrow .lbl .bad { color: var(--bad); }
.eqrow .math { overflow-x: auto; overflow-y: hidden; }
.eqrow .math .katex-display { margin: 0.2em 0; text-align: left; }
.eqrow .math .katex-display > .katex { text-align: left; }
.eqrow .d { color: var(--muted); font-size: 13px; }
.whr { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: 13px; margin: -4px 0 10px 4px; }
.whr .wl { color: var(--muted); font-style: italic; }
.whr .wt { white-space: nowrap; }
.eqrow .whr { margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); }

/* results: the methods' benchmark results */
body.resultsview #gbar, body.resultsview .gonly, body.resultsview #lanes .gonly, body.resultsview #hint { display: none; }
#results { position: absolute; inset: 0; overflow: auto; background: var(--bg); padding: 14px 20px 40px; cursor: default; user-select: text; -webkit-user-select: text; z-index: 2; }
#results .rbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
#results .rbar b { color: var(--fg); }
#results .empty { color: var(--muted); max-width: 60ch; }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; }
table.heat th { font-weight: 600; padding: 3px 6px; white-space: nowrap; cursor: pointer; vertical-align: bottom; }
table.heat th:hover { color: var(--accent); }
table.heat th.grp { border-bottom: 2px solid var(--border); text-align: center; }
table.heat th.sub { font-weight: 400; color: var(--muted); font-size: 12px; }
table.heat th.row { text-align: left; padding-right: 12px; }
table.heat tr.on th.row { color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); padding-left: 8px; }
table.heat tr.off th.row, table.heat tr.off td { opacity: .45; }
table.heat th .dir { color: var(--muted); font-weight: 400; margin-left: 3px; }
table.heat th.sorted::after { content: " ▾"; color: var(--accent); }
table.heat td.cell { min-width: 78px; height: 36px; padding: 2px 6px; text-align: center; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
table.heat td.cell:hover, table.heat td.cell.sel { outline: 2px solid var(--accent); }
table.heat td.obj { font-weight: 650; }
table.heat td.gap { width: 8px; padding: 0; }
td.cell .sd { color: var(--muted); font-size: 10.5px; font-weight: 400; }
td.cell .dl { display: block; font-size: 10.5px; font-weight: 400; white-space: nowrap; }
.dl.good { color: var(--ok); } .dl.bad { color: var(--bad); } .dl.same, .dl.weak { color: var(--muted); }
.dl .ag { opacity: .8; margin-left: 3px; }
td.cell.missing { background: repeating-linear-gradient(45deg, transparent 0 5px, var(--grid) 5px 10px); color: var(--muted); font-weight: 400; }
#detail .strip { width: 100%; height: auto; display: block; margin: 4px 0 10px; }
#detail .ev { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 4px 0 14px; }
#detail .ev.big { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
table.heat td.fig { padding: 3px; min-width: 0; }
table.heat td.fig img { display: block; height: 46px; width: auto; max-width: 96px; margin: 0 auto; border-radius: 3px; border: 1px solid var(--border); background: #fff; }
table.heat td.fig .more { font-size: 11px; color: var(--muted); }
#detail .ev figure { margin: 0; font-size: 12px; min-width: 0; }
#detail .ev img { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: zoom-in; }
#detail .ev figure.on img { outline: 2px solid var(--accent); outline-offset: 1px; }
#detail .ev figcaption { margin-top: 3px; color: var(--muted); overflow-wrap: anywhere; }
#detail .ev figcaption b { color: var(--fg); font-weight: 600; }
#lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; cursor: zoom-out; }
#lightbox img { max-width: 100%; max-height: calc(100% - 48px); object-fit: contain; background: #fff; border-radius: 4px; }
#lightbox div { color: #eee; font-size: 13px; text-align: center; }
#detail .strip text { font-size: 11px; fill: var(--fg); }
#detail .strip .mu { fill: var(--muted); }
#detail .strip circle { fill: var(--accent); fill-opacity: .55; }
#detail .strip .mean { stroke: var(--fg); stroke-width: 2; }
#detail .strip .axis { stroke: var(--border); }
#detail .strip .iv { stroke: var(--accent); stroke-opacity: .55; stroke-width: 1.4; }
#detail .strip .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
#detail .strip .pool { fill: var(--accent); fill-opacity: .14; }
#detail .strip .good { fill: var(--ok); } #detail .strip .bad { fill: var(--bad); }
#detail table.wts { border-collapse: collapse; font-size: 13px; }
#detail table.wts td { padding: 2px 10px 2px 0; }
#detail table.wts tr.varies td { font-weight: 650; }
#results .dsl { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
#results .dsl .chip { margin-left: 4px; }
table.heat th[data-ds] { cursor: pointer; }

/* lanes: other versions, one lane each, registered on one layout */
/* the library (home.py): over the page, or the whole page when nothing is open */
#library { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; }
.libbox { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: min(1100px, 100%); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
body.libfull { overflow: auto; height: auto; min-height: 100vh; }
body.libfull > :not(#library):not(script) { display: none !important; }
body.libfull #library { position: static; background: var(--bg); padding: 24px 16px 60px; }
body.libfull .libbox { box-shadow: none; max-height: none; border: none; background: transparent; }
body.libfull #libbody { overflow: visible; }
.libhead { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px 4px; }
.libhead h2 { font-size: 17px; margin: 0; }
body.libfull .libhead h2 { font-size: 22px; }
#libbody { overflow: auto; padding: 0 16px 12px; }
#libbody h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.libbox .mu { color: var(--muted); font-size: 12px; }
.libpath { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
.libpath .crumbs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0; min-width: 0; }
.libpath .crumb { border: none; background: none; padding: 2px 4px; color: var(--accent); }
.libpath .crumb:hover { text-decoration: underline; }
.libpath .sep { color: var(--muted); }
.libpath input { font: inherit; font-size: 12.5px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); width: 16em; }
table.libtab tr.dir td { cursor: pointer; }
table.libtab tr.dir b { color: var(--accent); font-weight: 560; }
table.libtab tr.dir b::before { content: ""; display: inline-block; width: 13px; height: 10px; margin-right: 7px; vertical-align: -1px;
  border: 1.5px solid currentColor; border-radius: 1px 3px 2px 2px; box-shadow: inset 0 2px 0 -0.5px currentColor; }
table.libtab tr.dir.empty td { color: var(--muted); }
table.libtab tr.dir.empty b { color: var(--muted); font-weight: 400; }
table.libtab tr.more td { color: var(--muted); font-size: 12px; cursor: pointer; }
table.libtab tr.more:hover td { color: var(--accent); }
.liberr { color: var(--bad); font-size: 12.5px; }
.libwait { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
button.linkish { border: none; background: none; color: var(--accent); padding: 2px 4px; font-size: 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
table.libtab { width: 100%; border-collapse: collapse; font-size: 13px; }
table.libtab th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.libtab th.sortable { cursor: pointer; }
table.libtab th.on, table.libtab th.sortable:hover { color: var(--accent); }
table.libtab th:first-child { width: 22px; }
table.libtab td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; }
table.libtab td.path { overflow-wrap: anywhere; }
table.libtab td.acts { white-space: nowrap; text-align: right; }
table.libtab td.acts button { margin-left: 4px; }
table.libtab tr.isopen td { opacity: .6; }
table.libtab tr:not(.isopen):hover td { background: var(--accent-soft); }
.libfoot { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 13px; }
body.libfull .libfoot { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
#lanes { flex: none; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 20px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
#lanes:empty { display: none; }
#lanes .lanectl { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
#lanes .lbl, #lanes .cmpnote { color: var(--muted); }
#lanes .cmpnote { margin-left: 4px; }
.lanechip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px 2px 6px; background: var(--panel); cursor: pointer; user-select: none; }
.lanechip:hover { border-color: var(--accent); }
.lanechip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.lanechip.over { box-shadow: -3px 0 0 var(--accent); }
.lanechip.over.after { box-shadow: 3px 0 0 var(--accent); }
.lanechip .grip { color: var(--muted); cursor: grab; font-size: 11px; }
.lanechip button { font-size: 11px; padding: 0 5px; border-radius: 4px; font-weight: 400; color: var(--muted); }
.lanechip button.on { color: var(--accent); border-color: var(--accent); }
.lane rect { fill: none; stroke: var(--border); stroke-dasharray: 4 3; rx: 10; }
.lane.on rect { stroke: var(--accent); stroke-dasharray: none; stroke-width: 1.5; }
.lane .lanehead { font-size: 12.5px; color: var(--muted); padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.lane .lanehead b { color: var(--fg); margin-right: 6px; }
.lane.on .lanehead b { color: var(--accent); }
.node.ghost { opacity: 0.4; }
.node.ghost .n { border-style: dashed; background: transparent; box-shadow: none; text-decoration: line-through; text-decoration-color: var(--bad); }
.n.fill { display: inline-flex; align-items: center; justify-content: center; }
.mk circle { stroke: var(--bg); stroke-width: 1.5; }
.mk text { font: 700 10px system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.added circle { fill: var(--ok); } .mk.changed circle { fill: var(--setting); } .mk.removed circle { fill: var(--bad); }
.mk.split circle, .mk.merged circle { fill: var(--output); } .mk.quiet circle { fill: var(--muted); }
#detail table.versions { border-collapse: collapse; width: 100%; font-size: 13px; }
#detail table.versions td:first-child { white-space: nowrap; }
#detail table.versions td { padding: 3px 6px; border-top: 1px solid var(--border); vertical-align: top; }
#detail table.versions tr { cursor: pointer; }
#detail table.versions tr:hover td { background: var(--accent-soft); }
#detail table.versions tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.vs.added { color: var(--ok); } .vs.changed { color: var(--setting); } .vs.none, .vs.same { color: var(--muted); } .vs.split, .vs.merged { color: var(--output); }
#detail .chg { margin: 6px 0; font-size: 13px; }
#detail .chg .k { color: var(--muted); margin-right: 6px; }
#detail .chg .chip.gone { text-decoration: line-through; text-decoration-color: var(--bad); }
#detail .eq.old { opacity: .75; border-style: dashed; }
#detail .eqlbl { font-size: 11.5px; color: var(--muted); margin: 8px 0 -6px; }
.code .del { background: color-mix(in srgb, var(--bad) 16%, transparent); display: inline-block; width: 100%; }
.code .ins { background: color-mix(in srgb, var(--ok) 16%, transparent); display: inline-block; width: 100%; }
.code .fold { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="hl">
    <div class="tline"><a id="home" href="/" hidden title="close everything and go to the library">←</a><h1 id="title"></h1><span id="meta"></span></div>
    <div class="desc" id="desc"></div>
  </div>
  <div class="toolbar">
    <span class="seg" id="viewseg" title="the methods' computation graph, or their benchmark results">
      <label><input type="radio" name="view" value="graph" checked><span>Graph</span></label>
      <label><input type="radio" name="view" value="results"><span>Results</span></label>
    </span>
    <button id="addlane" title="open other headways: beside this one, each in a lane of its own, or instead of it">Open…</button>
    <input type="file" id="lanefile" accept=".json,.html,.htm" multiple hidden>
  </div>
</header>
<div id="library" hidden><div class="libbox">
  <div class="libhead"><h2 id="libtitle">Open</h2><span class="mu" id="libsub"></span><span style="flex:1"></span><button id="libclose" title="close (Esc)">×</button></div>
  <div id="libbody"></div>
  <div class="libfoot" id="libfoot" hidden><span id="libsel"></span><button class="linkish" id="libnone">clear</button><span style="flex:1"></span><button id="libaddall"></button><button id="libopenall" class="primary"></button></div>
</div></div>
<div id="lanes"></div>
<div id="checks"></div>
<div id="work">
<div class="top">
  <div id="graph"><div id="gbar">
      <span class="grp"><details class="menu" id="groupsmenu"><summary title="expand, collapse, show or hide the groups">Groups ▾</summary><div><div class="mbtns"><button id="expand">Expand all</button><button id="collapse">Collapse all</button><button id="unchanged" hidden title="collapse the groups in which nothing changed, in every lane">Collapse unchanged</button></div><div id="groupslist"></div></div></details></span>
      <span class="grp" title="what is drawn"><label class="seg" id="settingslabel"><input type="checkbox" id="settings"><span>Settings &amp; constants</span></label><label class="seg" title="On: a copy of each data input (and setting or constant) next to every group that uses it. Off: one node each, with edges across the graph."><input type="checkbox" id="split" checked><span>Local inputs</span></label></span>
      <span class="grp seg" id="focus" title="the selection's upstream or downstream only">
        <label><input type="radio" name="focus" value="" checked><span>All</span></label>
        <label><input type="radio" name="focus" value="up"><span>Upstream</span></label>
        <label><input type="radio" name="focus" value="down"><span>Downstream</span></label>
      </span>
      <span class="grp" title="layout"><span class="seg" id="dir">
        <label><input type="radio" name="dir" value="RIGHT" checked><span>→</span></label>
        <label><input type="radio" name="dir" value="DOWN"><span>↓</span></label>
      </span><span class="zoom"><button id="zoomout" title="zoom out (or the mouse wheel)">−</button><button id="zoomin" title="zoom in (or the mouse wheel)">+</button></span><button id="fit" title="fit the whole graph in view">Fit</button></span>
    </div><svg id="svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker><marker id="arrowhl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs><g id="vp"></g></svg>
    <div id="results" hidden></div>
    <div id="note"></div>
    <div id="hint">click: select · double-click a group: collapse/expand · drag: pan · wheel: zoom</div>
  </div>
  <div class="split v" id="vsplit" title="drag to resize the side panel; double-click to collapse it"><button id="vtog"></button></div>
  <aside id="detail"><p class="empty">Select an operation, a value or a group to see its equation, its code and where it fits.</p></aside>
</div>
<div class="split h" id="hsplit" title="drag to resize the legend; double-click to collapse it"><button id="htog"></button></div>
<section id="legend">
  <div><h2>Indices</h2><table id="indices"></table><h2>Symbols</h2><table id="symbols"></table><h2 id="dshead" hidden>Datasets</h2><table id="datasets"></table><h2 id="fighead" hidden>Figures</h2><table id="figures"></table></div>
  <div><h2>Equations</h2><div id="equations"></div></div>
</section>
</div>
<div id="measure"></div>

<script>
let D = /*HEADWAY_DATA*/null;
const LIB = /*HEADWAY_LIBRARY*/null;      // served by `headway serve`: the library's launch directory (home.py)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
</script>
<script>
/* ---------- the library: what can be opened (served by `headway serve`, home.py) ----------
   One list for opening headways: the recently opened ones, and the specs and built headways in a folder (any
   folder can be browsed). With nothing open it is the whole page; with something open, it opens over it (Open…),
   to open more beside it or something else instead. Opened as a file, a page has no library: Open… is the
   browser's file picker. */
const lib = {showEmpty: false, full: false, dir: null, list: null, recent: [], allRecent: false, sort: "built_at", desc: true, error: ""};
const libPath = (abs) => LIB && abs.startsWith(LIB.root + "/") ? abs.slice(LIB.root.length + 1) : abs;
const libDate = (iso) => String(iso ?? "").replace("T", " ").slice(0, 16);
const libType = (x) => x.kind === "spec" ? "spec · served live" : (x.suite ? "benchmark suite" : "headway") + (x.page ? " · page" : " · JSON");
function libStoredDir() { try { return localStorage.getItem("headway.dir"); } catch { return null; } }
function libStoreDir(d) { try { localStorage.setItem("headway.dir", d); } catch {} }

async function openLibrary(full) {
  lib.full = full;
  document.body.classList.toggle("libfull", full);
  $("library").hidden = false;
  if (full) document.title = "headway";
  libDraw();
  const asked = new URLSearchParams(location.search).get("dir");
  await Promise.all([libLoad(asked || lib.dir || libStoredDir() || LIB?.root || ""), libRecent()]);
}
function closeLibrary() {
  if (lib.full) return;
  $("library").hidden = true;
}
async function libRecent() {
  try { lib.recent = (await (await fetch("/api/recent", {cache: "no-store"})).json()).recent; } catch { lib.recent = []; }
  libDraw();
}
async function libLoad(dir, push = false) {
  const asked = lib.asked = (lib.asked ?? 0) + 1;     // a slow folder must not replace one asked for after it
  lib.error = "";
  lib.loading = dir;
  libDraw();
  try {
    const r = await fetch("/api/list?dir=" + encodeURIComponent(dir), {cache: "no-store"});
    if (!r.ok) throw new Error(await r.text());
    const list = await r.json();
    if (asked !== lib.asked) return;
    lib.loading = null;
    lib.list = list;
    if (lib.list.dir !== lib.dir) lib.showEmpty = false;
    lib.dir = lib.list.dir;
    libStoreDir(lib.dir);
    if (lib.full && push) history.pushState({dir: lib.dir}, "", "/?dir=" + encodeURIComponent(lib.dir));
  } catch (e) {
    if (asked !== lib.asked) return;
    lib.loading = null;
    lib.error = String(e.message || e);
    if (!lib.list && dir !== LIB?.root) return libLoad(LIB?.root ?? "");
  }
  libDraw();
}
window.addEventListener("popstate", () => {
  if (!lib.full) return;
  const d = new URLSearchParams(location.search).get("dir");
  libLoad(d || LIB?.root || "");
});

// what is open in the page, to mark it and to add beside it
const libOpen = () => window.HW ? window.HW.open() : [];
const libIsOpen = (x) => libOpen().some((o) => o.src === x.abs || (o.title === x.title && o.name === x.name && o.built_at === x.built_at));

// a folder's subfolders, as rows above its headways: those with something in them (and how much), then the rest
function libFolderRows(L) {
  const count = {};
  for (const x of L.items) {
    const top = x.path.includes("/") ? x.path.split("/")[0] : null;
    if (!top) continue;
    count[top] ??= {built: 0, spec: 0};
    count[top][x.kind === "spec" ? "spec" : "built"]++;
  }
  const what = (c) => [c.built && `${c.built} built headway${c.built > 1 ? "s" : ""}`, c.spec && `${c.spec} spec${c.spec > 1 ? "s" : ""}`].filter(Boolean).join(" · ");
  const row = (f, empty) => `<tr class="dir${empty ? " empty" : ""}" data-sub="${esc(f)}" title="open this folder"><td></td><td colspan="7"><b>${esc(f)}</b>` +
    `${empty ? "" : ` <span class="mu">${esc(what(count[f]))}</span>`}</td></tr>`;
  const full = L.folders.filter((f) => count[f]), empty = L.folders.filter((f) => !count[f]);
  return full.map((f) => row(f, false)).join("") +
    (empty.length ? `<tr class="more" id="libempty"><td></td><td colspan="7">${lib.showEmpty ? "▾" : "▸"} ${empty.length} ${full.length ? "other " : ""}folder${empty.length > 1 ? "s" : ""}${L.short ? "" : " with no headways or specs found"}</td></tr>` +
      (lib.showEmpty ? empty.map((f) => row(f, true)).join("") : "") : "");
}
function libTable(items, {sortable, when, folders = ""}) {
  const open = libOpen(), title = window.HW?.title();
  const key = (x) => lib.sort === "type" ? libType(x) : lib.sort === "results" ? (x.results ?? []).join(", ")
    : String(x[lib.sort] ?? "").toLowerCase();
  let rows = items;
  if (sortable) {
    rows = [...items].sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0) * (lib.desc ? -1 : 1));
    if (title) rows.sort((a, b) => (b.title === title) - (a.title === title));   // the open method's first
  }
  const cols = [["name", "name"], ["title", "method"], ["type", "type"], [when, when === "opened_at" ? "opened" : "built"],
    ["results", "results"], ["path", "file"]];
  const head = `<tr><th></th>${cols.map(([k, label]) => sortable
    ? `<th data-sort="${k}" class="sortable${lib.sort === k ? " on" : ""}">${label}${lib.sort === k ? (lib.desc ? " ↓" : " ↑") : ""}</th>`
    : `<th>${label}</th>`).join("")}<th></th></tr>`;
  const body = rows.map((x) => {
    const isOpen = x.kind === "built" && libIsOpen(x);
    const acts = x.kind === "spec"
      ? `<button data-live="${esc(x.abs)}" title="serve this spec live: rebuilt as it and its code change">Serve live</button>`
      : isOpen ? `<span class="mu">open</span>`
      : `<button data-open="${esc(x.abs)}" title="open it instead of what is open">Open</button>` +
        (open.length ? `<button data-add="${esc(x.abs)}" title="open it in a lane of its own, beside what is open">Add beside</button>` : "");
    return `<tr class="${isOpen ? "isopen" : ""}${title && x.title === title ? " mine" : ""}">` +
      `<td>${x.kind === "built" && !isOpen ? `<input type="checkbox" data-pick="${esc(x.abs)}" data-at="${esc(x.built_at)}">` : ""}</td>` +
      `<td><b>${esc(x.name)}</b>${Object.keys(x.keys ?? {}).length ? `<div class="mu">${esc(Object.entries(x.keys).map(([k, v]) => `${k}=${v}`).join(" "))}</div>` : ""}</td>` +
      `<td>${esc(x.title)}</td><td class="mu">${esc(libType(x))}</td>` +
      `<td class="mu">${esc(libDate(x[when]))}${x.git?.describe ? `<div>${esc(x.git.describe)}</div>` : ""}</td>` +
      `<td class="mu">${esc((x.results ?? []).join(", ")) || "–"}</td><td class="mu path">${esc(x.path)}</td>` +
      `<td class="acts">${acts}</td></tr>`;
  }).join("");
  return `<table class="libtab">${head}${folders}${body}</table>`;
}

function libDraw() {
  const L = lib.list;
  const crumbs = (() => {
    const shown = lib.loading?.startsWith("/") ? lib.loading : L?.dir;     // the folder asked for, while it loads
    if (!shown) return "";
    const parts = shown.split("/").filter(Boolean);
    return parts.map((p, n) => `<button class="crumb" data-dir="${esc("/" + parts.slice(0, n + 1).join("/"))}">${esc(p)}</button>`).join(`<span class="sep">/</span>`);
  })();
  const recent = lib.recent.slice(0, lib.allRecent ? lib.recent.length : 8);
  const title = window.HW?.title();
  $("libtitle").textContent = lib.full ? "headway" : "Open";
  $("libsub").textContent = lib.full ? "open a built headway, several side by side, or serve a spec live" : `beside ${title}, or instead of it`;
  $("libclose").hidden = lib.full;
  $("libbody").innerHTML =
    (lib.recent.length ? `<h3>Recent</h3>${libTable(recent, {sortable: false, when: "opened_at"})}` +
      (lib.recent.length > 8 ? `<button class="linkish" id="libmore">${lib.allRecent ? "fewer" : `all ${lib.recent.length}`}</button>` : "") : "") +
    `<h3>Folder</h3><div class="libpath"><button id="libup" title="the folder above"${L?.parent ? "" : " disabled"}>↑</button>` +
    `<span class="crumbs"><button class="crumb" data-dir="/">/</button>${crumbs}</span>` +
    `<span style="flex:1"></span><button data-dir="${esc(LIB?.root ?? "")}" title="the folder headway serve was launched in">launch</button>` +
    `<button data-dir="${esc(L?.home ?? "~")}" title="your home folder">home</button>` +
    `<input id="libgo" placeholder="go to a folder…" spellcheck="false"></div>` +
    (lib.error ? `<p class="liberr">${esc(lib.error)}</p>` : "") +
    (lib.loading ? `<p class="libwait"><span class="spin"></span>Looking for specs and built headways in ${esc(lib.loading)} and the folders below it…</p>` : "") +
    (!L || lib.loading ? "" : L.items.length || L.folders.length ? libTable(L.items, {sortable: true, when: "built_at", folders: libFolderRows(L)}) +
      (L.short ? `<p class="mu">Not everything below this folder was looked through (too many files, or too deep); open a subfolder for the rest.</p>` : "") : "") +
    (L && !lib.loading && !L.items.length ? `<p class="mu">No specs or built headways in this folder or below it${L.short ? " (as far as was looked)" : ""}. <code>headway build SPEC -o FILE.html</code> (or <code>--json</code>) makes one.</p>` : "");
  const body = $("libbody");
  body.querySelectorAll("[data-dir]").forEach((b) => b.onclick = () => libLoad(b.dataset.dir, true));

      h += `<td class="cell${focused("metric", m.key, d.key) ? " sel" : ""}" data-metric="${esc(m.key)}" data-dataset="${esc(d.key)}" style="${cellStyle(goodness(mean(v), m, column))}" title="${v.length} value${v.length > 1 ? "s" : ""}: ${esc(v.map((x, k) => (ids ? ids[k] + ": " : "") + fmt(x) + (ivs?.[k] ? ` [${fmt(ivs[k][0])}, ${fmt(ivs[k][1])}]` : "")).join(", "))}${pd ? "\n" + esc(pairedTitle(pd, row.lane.name, rr.lane.name, m)) : ""}">` +
        `${fmt(mean(v))}${v.length > 1 ? `<span class="sd"> ±${fmt(sd(v))}</span>` : ""}${pd ? pairedHTML(pd, m.better) : ""}</td>`;
    }

  }
  h += `</tbody></table>`;
  h += `<p class="dsl">Datasets:${datasets.map((d) => `<span class="chip${focused("dataset", d.key) ? " on" : ""}" data-ds="${esc(d.key)}" title="${esc(d.desc ?? "")}">${esc(d.name)}</span>`).join("")}</p>`;

  el.querySelectorAll("input[name=rcolor]").forEach((r) => r.onchange = () => { rs.color = r.value; saveRs(); renderResults(); });
  $("rdelta").onchange = (e) => { rs.delta = e.target.checked; saveRs(); renderResults(); };
  if ($("rheld")) $("rheld").onchange = (e) => { rs.heldout = e.target.checked; saveRs(); renderResults(); };
  const pick = (focus) => {
    const again = rs.focus && JSON.stringify(rs.focus) === JSON.stringify(focus);
    if (again && focus.kind !== "lane" && focus.kind !== "figure") rs.sort = rs.sort && JSON.stringify(rs.sort) === JSON.stringify(focus) ? null : focus;
    rs.focus = focus;
    renderResults();
    showResultDetail();
  };
  el.querySelectorAll("[data-obj]").forEach((c) => c.addEventListener("click", () => pick({kind: "objective", key: c.dataset.obj})));
  el.querySelectorAll("[data-metric]").forEach((c) => c.addEventListener("click", () => pick({kind: "metric", key: c.dataset.metric, dataset: c.dataset.dataset ?? null})));
  el.querySelectorAll("[data-ds]").forEach((c) => c.addEventListener("click", () => pick({kind: "dataset", key: c.dataset.ds})));
  el.querySelectorAll("[data-fig]").forEach((c) => c.addEventListener("click", () => pick({kind: "figure", key: c.dataset.fig, dataset: c.dataset.dataset ?? null})));
  el.querySelectorAll("th.row").forEach((c) => c.addEventListener("click", () => {
    const lane = LANES.find((l) => l.id === +c.dataset.lane);
    setActive(lane);
    pick({kind: "lane", key: lane.id});
  }));
}

// the side panel in the Results view: what a metric or objective is, and the values' spread
function showResultDetail() {

    if (ref && current) {

/* ---------- datasets: a suite's steps that make the data, and each dataset's values of their settings ---------- */
// the steps that make the data: those taking a setting some dataset gives a value, and the rest of their groups
function dataSteps(suite, meta) {
  const valued = new Set(meta.datasets.flatMap((d) => Object.keys(d.values ?? {})));
  const direct = suite.ops.filter((o) => o.inputs.some((k) => valued.has(k)));
  const groups = new Set(direct.map((o) => o.group).filter(Boolean));
  return suite.ops.filter((o) => direct.includes(o) || groups.has(o.group));
}
const valuesText = (d, suite) => Object.entries(d.values ?? {}).map(([k, v]) => `${tex(suite.symbols.find((x) => x.key === k)?.tex ?? k)} = ${esc(v)}`).join(", ");
function datasetHTML(d, suite, meta, extra = "") {
  const sym = (k) => suite.symbols.find((x) => x.key === k);
  const varies = (k) => new Set(meta.datasets.map((x) => x.values?.[k] ?? sym(k)?.value ?? null)).size > 1;
  let h = `<h2>${esc(d.name)}${pen(d.decl, "name", "the name")}</h2><div class="crumb">dataset${d.heldout ? " · held out: kept out of development" : ""} · ${esc(suite.title)}</div>` + declHTML(d.decl);
  if (d.desc) h += `<p>${rich(d.desc)}${pen(d.decl, "desc", "the description")}</p>`;
  if (d.source) h += `<p class="empty">Source: ${rich(d.source)}</p>`;
  const vals = Object.entries(d.values ?? {});
  if (vals.length) {
    h += `<h3>Settings${pen(d.decl, "values", "the values")}</h3><table class="wts">` + vals.map(([k, v]) => `<tr${varies(k) ? ` class="varies" title="differs between the datasets"` : ""}><td>${tex(sym(k)?.tex ?? k)}</td><td>${esc(sym(k)?.name ?? k)}</td><td><code>${esc(v)}</code></td></tr>`).join("") + `</table>`;
    if (vals.some(([k]) => varies(k)) && vals.some(([k]) => !varies(k))) h += `<p class="empty">In bold, the settings that differ between the datasets.</p>`;
  }
  const facts = Object.entries(d.facts ?? {});
  if (facts.length) h += `<h3>Facts${pen(d.decl, "facts", "the facts")}</h3><table class="wts">${facts.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${rich(v)}</td></tr>`).join("")}</table>`;
  const steps = vals.length ? dataSteps(suite, meta) : [];
  if (steps.length) h += `<h3>How it is made</h3>` + steps.map((o) => `<div class="eqlbl">${esc(o.label)}</div>${o.tex ? `<div class="eq">${tex(o.tex, true)}</div>` : ""}${whereHTML(o)}`).join("");
  h += extra;
  if (d.code?.length) h += `<h3>Code${pen(d.decl, "code", "the code references")}</h3>${codeHTML(d.code)}`;

}

  ...(Object.keys(d.values ?? {}).length ? [`  settings: ${Object.entries(d.values).map(([k, v]) => `${suite.symbols.find((x) => x.key === k)?.name ?? k} (\`${k}\`) = ${v}`).join(", ")}`] : []),

// a version's keys: free-form labels (a hyperparameter, a variant) given when it was built

// the images the versions' benchmark made on a dataset, side by side by title: to look at, not ranked

// a figure on a dataset: every version's images side by side

// click an image for it at full size; a click or Escape closes it

// the replicates of each version, one row each, on the metric's scale
function stripHTML(m, rows) {
  const W = 420, left = 74, right = 14, rowH = 18, top = 20;
  const all = rows.flatMap((x) => [...(x.v ?? []), ...(x.ivs ?? []).flat().filter((q) => q !== null)]);
  // the values' extent, padded, within the metric's range
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.05 || 0.5;
  [lo, hi] = [lo - pad, hi + pad];
  if (m.range) [lo, hi] = [Math.max(lo, m.range[0]), Math.min(hi, m.range[1])];
  const x = (v) => left + (v - lo) / (hi - lo) * (W - left - right);
  const H = top + rows.length * rowH + 22;
  let g = `<text x="${W - right}" y="12" text-anchor="end" class="mu">${m.better === "higher" ? "better →" : "← better"}</text>`;
  rows.forEach((row, k) => {
    const y = top + k * rowH + rowH / 2;
    g += `<text x="${left - 8}" y="${y + 4}" text-anchor="end"${row.lane === active ? ' font-weight="700"' : ""}>${esc(row.lane.name)}</text>`;
    if (!row.v) { g += `<text x="${left}" y="${y + 4}" class="mu">not run</text>`; return; }
    // replicates spread a little up and down, so that their intervals do not lie on one another
    const dy = (n) => row.ivs ? (n - (row.v.length - 1) / 2) * Math.min(3, 12 / row.v.length) : 0;
    row.ivs?.forEach((iv, n) => { if (iv) g += `<line class="iv" x1="${x(Math.max(lo, iv[0])).toFixed(1)}" x2="${x(Math.min(hi, iv[1])).toFixed(1)}" y1="${y + dy(n)}" y2="${y + dy(n)}"/>`; });
    row.v.forEach((v, n) => { g += `<circle cx="${x(v).toFixed(1)}" cy="${y + dy(n)}" r="3.4"><title>${row.ids ? esc(row.ids[n]) + ": " : ""}${fmt(v)}${row.ivs?.[n] ? ` [${fmt(row.ivs[n][0])}, ${fmt(row.ivs[n][1])}]` : ""}</title></circle>`; });
    const mu = x(mean(row.v));
    g += `<line class="mean" x1="${mu}" x2="${mu}" y1="${y - 7}" y2="${y + 7}"><title>mean ${fmt(mean(row.v))}</title></line>`;
  });
  const yAxis = top + rows.length * rowH + 4;
  g += `<line class="axis" x1="${left}" x2="${W - right}" y1="${yAxis}" y2="${yAxis}"/>` +
    [lo, (lo + hi) / 2, hi].map((v, k) => `<text x="${x(v)}" y="${yAxis + 14}" text-anchor="${["start", "middle", "end"][k]}" class="mu">${fmt(v)}</text>`).join("");
  return `<svg class="strip" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// each version's difference from the one it is compared with, one row per pair, centered on 0: each replicate's
// difference, with the benchmark's interval of it, and the pooled interval if it gave one
// the pairs to show on a metric and dataset: each version against the one it is compared with, then every other
// pair among the open versions whose difference the benchmark gave (in either version's results), once each
function diffPairs(mk, dk, rows) {
  const seen = new Set(), pairs = [];
  const add = (row, refLane, extra) => {
    const key = [row.lane.id, refLane.id].sort().join("|"), ref = rows.find((x) => x.lane === refLane);
    const p = !seen.has(key) && ref?.r && row.r ? pairedDiff(row.r, ref.r, dk, mk, row.lane.name, refLane.name) : null;
    if (p) { seen.add(key); pairs.push({row, ref: refLane, p, extra}); }
  };
  for (const row of rows) { const rr = refOf(row.lane); if (rr) add(row, rr, false); }
  for (const row of rows) for (const [name, by] of Object.entries(row.r?.differences ?? {})) {
    const other = by?.[dk]?.[mk] && rows.find((x) => x.lane !== row.lane && x.lane.name === name);
    if (other) add(row, other.lane, true);
  }
  return pairs;
}
function diffsHTML(m, dk, rows) {
  const pairs = diffPairs(m.key, dk, rows);
  if (!pairs.length) return "";
  const W = 420, left = 74, right = 64, rowH = 20, top = 20;
  const pts = (p) => p.paired ? p.points : [{d: p.d}];
  const all = [0, ...pairs.flatMap(({p}) => [...pts(p).flatMap((q) => [q.d, ...(q.iv ?? [])]), ...(p.pooled ? p.intervals.flat() : [])])];
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || 0.01;
  [lo, hi] = [lo - pad, hi + pad];
  const x = (v) => left + (v - lo) / (hi - lo) * (W - left - right);
  const H = top + pairs.length * rowH + 22;
  let g = `<text x="${W - right}" y="12" text-anchor="end" class="mu">${m.better === "higher" ? "better →" : "← better"}</text>` +
    `<line class="zero" x1="${x(0)}" x2="${x(0)}" y1="${top - 4}" y2="${top + pairs.length * rowH}"/>`;
  pairs.forEach(({row, ref, p}, k) => {
    const y = top + k * rowH + rowH / 2, ps = pts(p);
    if (pairs[k - 1] && !pairs[k - 1].extra && pairs[k].extra) g += `<line class="axis" x1="8" x2="${W - 8}" y1="${y - rowH / 2}" y2="${y - rowH / 2}" stroke-dasharray="2 3"/>`;
    g += `<text x="${left - 8}" y="${y + 4}" text-anchor="end"${row.lane === active ? ' font-weight="700"' : ""}${pairs[k].extra ? ' class="mu"' : ""}>${esc(row.lane.name)} − ${esc(ref.name)}</text>`;
    if (p.pooled) for (const [a, b] of p.intervals) g += `<rect class="pool" x="${x(a)}" y="${y - 7}" width="${Math.max(1, x(b) - x(a))}" height="14"><title>pooled interval [${fmt(a)}, ${fmt(b)}]</title></rect>`;
    const dy = (n) => (n - (ps.length - 1) / 2) * Math.min(3, 12 / ps.length);
    ps.forEach((q, n) => {
      if (q.iv) g += `<line class="iv" x1="${x(q.iv[0])}" x2="${x(q.iv[1])}" y1="${y + dy(n)}" y2="${y + dy(n)}"/>`;
      g += `<circle cx="${x(q.d).toFixed(1)}" cy="${y + dy(n)}" r="3.4"><title>${q.id ? esc(q.id) + ": " : ""}${q.d >= 0 ? "+" : ""}${fmt(q.d)}${q.iv ? ` [${fmt(q.iv[0])}, ${fmt(q.iv[1])}]` : ""}</title></circle>`;
    });
    const good = m.better === "higher" ? p.d > 0 : p.d < 0;
    g += `<text x="${W - right + 6}" y="${y + 4}" class="${p.supported ? (good ? "good" : "bad") : "mu"}">${p.paired ? `${p.agree}/${p.n}` : "unpaired"}${p.marker ? " " + p.marker : ""}<title>${esc(pairedTitle(p, row.lane.name, ref.name, m))}</title></text>`;
  });
  const yAxis = top + pairs.length * rowH + 4;
  g += `<line class="axis" x1="${left}" x2="${W - right}" y1="${yAxis}" y2="${yAxis}"/>` +
    [lo, 0, hi].map((v, k) => `<text x="${x(v)}" y="${yAxis + 14}" text-anchor="${["start", "middle", "end"][k]}" class="mu">${k === 1 ? "0" : fmt(v)}</text>`).join("");
  const none = pairs.filter(({p}) => p.paired && !p.intervals.length).map(({row, ref}) => `${row.lane.name} − ${ref.name}`);
  const extra = pairs.some((x) => x.extra);
  return `<div class="eqlbl" style="margin-top:2px">Differences from the version each is compared with${extra ? ", then (in grey) the other pairs the benchmark compared" : ""}${m.interval ? `; whiskers: ${esc(m.interval)}` : ""}</div><svg class="strip" viewBox="0 0 ${W} ${H}">${g}</svg>` +
    (none.length ? `<p class="empty" style="margin-top:-6px">No interval of the difference from the benchmark for ${esc(none.join(", "))}.</p>` : "");
}

// prompts from the Results view: why the versions differ on what is selected, and what to try next
const RESULT_ASKS = [
  ["Why do they differ?", "explain the differences between the versions from what changed in each", "Explain why the versions differ on this, step by step through what changed from each version to the next. Separate differences that the replicates' spread could explain from real ones. For each real difference, point to the change in the method that most likely caused it, and say how sure you are and how to confirm it (e.g. an ablation)."],
  ["What to try next?", "propose the next changes to try, and what each should do to the results", "Propose two or three changes to the method to try next, to do better on this without doing worse elsewhere. For each: what to change (in the spec's terms: which step, which equation), why, the effect you expect on each metric, and the experiment that would show it. Do not make any change yet."],
];
function resultsAskHTML() {
  return `<div class="ask" id="askbox"><h3>Ask an AI</h3><div class="presets">${RESULT_ASKS.map(([label, tip], n) => `<button data-rask="${n}" title="${esc(tip)}: adds the whole prompt to the box, below what is there">${esc(label)}</button>`).join("")}</div>` +
    `<textarea id="ask" placeholder="Or ask your own question about these results"></textarea>` +
    `<div class="formats"><span>Answer as</span>${FORMATS.map(([k, label, tip]) => `<button data-format="${k}" class="${ask.format === k ? "on" : ""}" title="${esc(tip)}">${esc(label)}</button>`).join("")}</div>` +
    `<div class="row"><button id="askcopy">Copy prompt</button><span>a question you typed, with the results, the metric's definition and what changed between the versions; a whole prompt in the box (from a button), as it is</span></div>` +
    `<details><summary style="cursor:pointer;font-size:12px;color:var(--muted);margin-top:6px">preview</summary><pre id="askpreview"></pre></details></div>`;
}
function wireResultsAsk() {
  const box = $("ask"), preview = $("askpreview");
  if (!box) return;
  const copyText = () => wholePrompt(box.value) ? box.value.trim() : resultsPrompt(box.value.trim());
  const refresh = () => { preview.textContent = copyText(); preview.closest("details").hidden = wholePrompt(box.value); };
  box.addEventListener("input", refresh);
  refresh();
  document.querySelectorAll("#askbox [data-rask]").forEach((b) => b.addEventListener("click", () => {
    appendPrompt(box, resultsPrompt(RESULT_ASKS[+b.dataset.rask][2]));
    refresh();
  }));
  document.querySelectorAll("#askbox [data-format]").forEach((b) => b.addEventListener("click", () => {
    ask.format = b.dataset.format; saveAsk();
    document.querySelectorAll("#askbox [data-format]").forEach((o) => o.classList.toggle("on", o === b));
    refresh();
  }));
  $("askcopy").addEventListener("click", async () => {
    const text = copyText();
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    note(`Copied the prompt (${text.split("\n").length} lines)${box.value.trim() ? "" : "; it has no question yet"}`);
  });
}
const RESULTS_CONTEXT = "Context: each version's computation is described by a headway spec (a Python module of steps with equations, inputs, outputs and references into the code); the benchmark is a headway suite, whose metrics are declared the same way. The results were computed by the benchmark, outside headway; each value below is the mean over replicates ± their standard deviation (n).";
function resultsPrompt(question) {
  const sn = suiteNow(), f = rs.focus;
  if (!sn) return "";
  const {meta, suite} = sn;
  const rows = LANES.map((lane) => ({lane, r: resultsOf(lane, sn.id)}));
  const sym = (k) => suite.symbols.find((x) => x.key === k), op = (k) => suite.ops.find((x) => x.key === k);
  const about = !f || f.kind === "lane" ? "the results as a whole" : f.kind === "dataset" ? `the results on the dataset "${meta.datasets.find((d) => d.key === f.key)?.name}"` : f.kind === "objective" ? `the objective "${meta.objectives.find((o) => o.key === f.key)?.name}"`
    : f.kind === "figure" ? `the figure "${(meta.figures ?? []).find((x) => x.key === f.key)?.name}"${f.dataset ? ` on the dataset "${meta.datasets.find((d) => d.key === f.dataset)?.name}"` : ""}`
    : `the metric "${sym(f.key)?.name}"${f.dataset ? ` on the dataset "${meta.datasets.find((d) => d.key === f.dataset)?.name}"` : ""}`;
  const L = [`I am comparing versions of the method "${own.D.title}" on the benchmark "${suite.title}" (version ${meta.version}), and want to understand ${about}.`, "",
    "My question:", question || "<your question here>", "", "How to answer: " + formatText(), "",
    RESULTS_CONTEXT, ""];
  L.push(`The versions, in order: ${rows.map(({lane}) => `"${lane.name}" (${laneMeta(lane)}${keysText(lane.D.keys) ? `; keys: ${keysText(lane.D.keys)}` : ""})`).join("; ")}.`, "");
  const metricLines = (m) => {
    const s = sym(m.key), o = op(m.key);
    return [`- ${s?.name} (\`${m.key}\`, $${s?.tex}$), ${m.better} is better${m.range ? `, from ${m.range[0]} to ${m.range[1]}` : ""}${m.interval ? `; intervals: ${m.interval}` : ""}: ${s?.desc ?? ""}`,
      ...(o?.tex ? [`  equation: ${o.tex}`] : []), ...(o?.code?.length ? [`  code: ${o.code.map((c) => c.ref).join(", ")}`] : [])];
  };
  const shown = f?.kind === "metric" ? meta.metrics.filter((m) => m.key === f.key) : meta.metrics;
  L.push("The metrics:", ...shown.flatMap(metricLines), "");
  const datasets = meta.datasets.filter((d) => (rs.heldout || !d.heldout) && ((f?.kind === "metric" || f?.kind === "figure") && f.dataset ? d.key === f.dataset : f?.kind === "dataset" ? d.key === f.key : true));
  L.push("The datasets:", ...datasets.flatMap((d) => datasetLines(d, suite)), "");
  const steps = datasets.some((d) => Object.keys(d.values ?? {}).length) ? dataSteps(suite, meta) : [];
  if (steps.length) L.push("How the datasets are made (the suite's steps; the datasets differ in the settings above):", ...steps.map((o) => `- ${o.label}: ${o.tex}${o.where?.length ? `, where ${o.where.map(([t, def]) => `${t}: ${def}`).join("; ")}` : ""}`), "");
  L.push("The results:");
  for (const m of shown) for (const d of datasets) {
    L.push(`- ${sym(m.key)?.name} on ${d.name}: ` + rows.map(({lane, r}) => {
      const v = r?.values[d.key]?.[m.key], ids = r?.replicates?.[d.key]?.[m.key], ivs = r?.intervals?.[d.key]?.[m.key];
      return `${lane.name} ${v?.length ? `${fmt(mean(v))} ± ${fmt(sd(v))} (${v.length}${ids || ivs ? `: ${v.map((x, k) => `${ids ? ids[k] + " " : ""}${fmt(x)}${ivs?.[k] ? ` [${fmt(ivs[k][0])}, ${fmt(ivs[k][1])}]` : ""}`).join(", ")}` : ""})` : "not run"}`;
    }).join("; "));
    for (const {row, ref, p} of diffPairs(m.key, d.key, rows)) L.push(`  - ${pairedTitle(p, row.lane.name, ref.name, m)}`);
  }
  if (rows.some(({r}) => r?.replicates)) L.push("(Values listed by replicate id are paired across versions by that id: the same seed or fold. Each version's difference from the one it is compared with is the mean of its per-replicate differences. Two sources of uncertainty are kept apart: the spread over replicates, and the benchmark's intervals, which are over the sampled units within one replicate; a version's own intervals can overlap another's even when the interval of their difference excludes 0, so judge differences by the latter.)");
  const figs = (meta.figures ?? []).filter((fg) => f?.kind !== "figure" || fg.key === f.key);
  const images = figs.flatMap((fg) => datasets.flatMap((d) => rows.flatMap(({lane, r}) => (r?.figures?.[d.key]?.[fg.key] ?? []).map((e) =>
    `- ${fg.name}, ${lane.name} on ${d.name}: ${e.path ?? e.url}${e.replicate ? `, replicate ${e.replicate}` : ""}${e.caption ? ` (${e.caption})` : ""}${keysText(e.keys) ? `; ${keysText(e.keys)}` : ""}`))));
  for (const o of meta.objectives) {
    const {scores} = objScores(rows.map((x) => x.r), o, meta);
    L.push(`- objective ${o.name} (${o.how === "mean" ? "a weighted mean of the range-scaled metrics, 1 is best" : "a weighted mean rank, 1 is best"}): ` + rows.map(({lane}, n) => `${lane.name} ${scores[n] === null ? "incomplete" : fmt(scores[n])}`).join("; "));
  }
  L.push("");
  if (images.length) L.push("The figures: images the benchmark made, to look at, not ranked (open the files to see them).",
    ...figs.map((fg) => `- ${fg.name} (\`${fg.key}\`): ${fg.desc ?? ""}${fg.code?.length ? ` Drawn by: ${fg.code.map((c) => c.ref).join(", ")}` : ""}`), "The images:", ...images, "");
  if (current) for (const lane of LANES) {
    const ref = refOf(lane);
    if (!ref) continue;
    const lines = summaryLinesFor(lane, ref);
    if (lines.length) L.push(...lines);
  }
  L.push("Please:", "- This is a request for an explanation, not a change: do not edit the spec, the method's code, the benchmark or any other file.",
    "- Take the code as the ground truth; read each version's spec and code (the git history or the saved versions) where the question needs it.",
    "- Say which reasons are documented and which are your own reading; do not present a guess as established.");
  return L.join("\n");
}

function setView(v) {
  rs.view = v === "results" ? "results" : "graph";
  saveRs();
  document.body.classList.toggle("resultsview", rs.view === "results");
  $("results").hidden = rs.view !== "results";
  document.querySelectorAll("input[name=view]").forEach((r) => r.checked = r.value === rs.view);
  if (rs.view === "results") { renderResults(); showResultDetail(); }
  else showDetail(state.sel);
}
function viewSwitch() {
  $("viewseg").hidden = false;           // with no results, the Results view says how to get them
}
document.querySelectorAll("input[name=view]").forEach((r) => r.onchange = () => setView(r.value));

/* ---------- start ---------- */
document.addEventListener("click", (e) => { if (e.target.closest(".pen")) e.stopPropagation(); }, true);
function header(buildError = "") {
  $("title").textContent = D.title;
  $("home").hidden = !LIB;
  document.title = D.title;
  $("desc").innerHTML = rich(D.desc);
  $("desc").hidden = !D.desc;
  requestAnimationFrame(descFit);
  $("meta").innerHTML = (D.live ? `<span id="live" class="on" title="headway serve: the page updates when the spec or the code changes">live</span> · ` : "") +
    `built ${esc(D.built)}${gitText(D) ? " · " + esc(gitText(D)) : ""}${D.snapshot ? ` · a saved version (${esc(active.name)})` : ""}`;
  $("checks").innerHTML = buildError
    ? `<div class="checks"><b>The rebuild failed</b> (this is the last good build): ${esc(buildError.trim().split("\n").pop())}<details><summary>output</summary><pre>${esc(buildError)}</pre></details></div>`
    : D.check.errors.length ? `<div class="checks"><b>${D.check.errors.length} check error${D.check.errors.length > 1 ? "s" : ""}:</b> the graph may not match the code.<pre>${esc(D.check.errors.join("\n"))}</pre></div>` : "";
  const names = (role) => D.symbols.filter((s) => s.role === role).map((s) => s.name).join(", ") || "none";
  $("settingslabel").title = "Add to the graph, with edges to the steps that use them, the settings (configurable; amber, dashed): "
    + names("setting") + " — and the constants (fixed in the code; grey, dotted): " + names("constant");
}
// the description takes one line; when it does not fit, a click shows all of it, and another click one line again
function descFit() {
  const el = $("desc"), full = el.classList.contains("full");
  el.classList.toggle("clip", !full && el.scrollWidth > el.clientWidth + 1);
  el.title = full ? "click to show one line" : el.classList.contains("clip") ? "click to show all of it" : "";
}
$("desc").onclick = (e) => {
  const el = e.currentTarget;
  if (!el.classList.contains("clip") && !el.classList.contains("full")) return;
  el.classList.toggle("full");
  descFit();
};
window.addEventListener("resize", descFit);
$("expand").onclick = () => { state.collapsed.clear(); render(true); };
$("collapse").onclick = () => { LANES.forEach((l) => l.D.groups.forEach((g) => state.collapsed.add(g.path))); render(true); };
$("settings").onchange = (e) => {
  state.settings = e.target.checked;
  render(false, true);
  const n = (role) => D.symbols.filter((s) => s.role === role).length;
  note(state.settings ? `Added ${n("setting")} setting${n("setting") === 1 ? "" : "s"} (dashed) and ${n("constant")} constant${n("constant") === 1 ? "" : "s"} (dotted) to the graph` : `Settings and constants hidden; they are listed in the legend below`);
};
$("split").onchange = (e) => {
  state.split = e.target.checked;
  render(false, true);
  note(state.split ? "Each input is drawn next to every group that uses it" : "One node per input, with edges across the graph");
};
let noteTimer;
function note(text) {
  const el = $("note");
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => el.classList.remove("on"), 2800);
}
document.querySelectorAll("input[name=focus]").forEach((r) => r.onchange = () => { state.focus = r.value; render(true); });
document.querySelectorAll("input[name=dir]").forEach((r) => r.onchange = () => { state.dir = r.value; render(true); });
$("fit").onclick = () => fitView();
$("zoomin").onclick = () => zoomStep(1.25);
$("zoomout").onclick = () => zoomStep(1 / 1.25);

/* ---------- layout: the side panel and the legend resize and collapse; kept per browser ---------- */
const layout = {detail: 460, legend: Math.round(innerHeight * 0.36), detailOpen: true, legendOpen: true};
try { Object.assign(layout, JSON.parse(localStorage.getItem("headway.layout") ?? "{}")); } catch {}
function applyLayout() {
  const b = document.body;
  b.style.setProperty("--detail-w", layout.detail + "px");
  b.style.setProperty("--legend-h", layout.legend + "px");
  b.classList.toggle("nodetail", !layout.detailOpen);
  b.classList.toggle("nolegend", !layout.legendOpen);
  $("vsplit").classList.toggle("shut", !layout.detailOpen);
  $("hsplit").classList.toggle("shut", !layout.legendOpen);
  $("vtog").textContent = layout.detailOpen ? "›" : "‹";
  $("vtog").title = layout.detailOpen ? "collapse the side panel" : "show the side panel";
  $("htog").textContent = layout.legendOpen ? "⌄" : "⌃";
  $("htog").title = layout.legendOpen ? "collapse the legend" : "show the legend";
  try { localStorage.setItem("headway.layout", JSON.stringify(layout)); } catch {}
}
function splitter(el, open, size, min, measure) {
  const toggle = () => { layout[open] = !layout[open]; applyLayout(); };
  el.querySelector("button").addEventListener("click", toggle);
  el.addEventListener("dblclick", (e) => { if (!e.target.closest("button")) toggle(); });
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest("button")) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add("drag");
    const before = layout[open] ? layout[size] : null;
    const move = (e) => {
      const [want, max] = measure(e, $("work").getBoundingClientRect());
      layout[open] = want >= min / 2;                               // dragged nearly shut: collapse, keeping its size
      layout[size] = layout[open] ? Math.round(Math.min(Math.max(want, min), max)) : before ?? layout[size];
      applyLayout();
    };
    const up = () => { el.classList.remove("drag"); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
  });
}
splitter($("vsplit"), "detailOpen", "detail", 240, (e, r) => [r.right - e.clientX, r.width - 200]);
splitter($("hsplit"), "legendOpen", "legend", 100, (e, r) => [r.bottom - e.clientY, r.height - 120]);
applyLayout();

/* ---------- live: under `headway serve`, take each rebuild without losing the view ---------- */
function update(next) {
  const key = (kind, x) => kind + ":" + (x.key ?? x.path);
  const entries = (d) => new Map([...d.ops.map((o) => [key("o", o), o]), ...d.symbols.map((x) => [key("s", x), x]),
    ...d.groups.map((g) => [key("G", g), g])].map(([k, v]) => [k, JSON.stringify({...v, decl: null})]));
  delete next.lanes;                                // the other versions were taken when the page loaded
  const old = entries(own.D), now = entries(next);
  const changed = new Set([...now].filter(([k, v]) => old.has(k) && old.get(k) !== v).map(([k]) => k));
  const added = [...now.keys()].filter((k) => !old.has(k)).length, removed = [...old.keys()].filter((k) => !now.has(k)).length;
  const known = new Set(own.D.groups.map((g) => g.path));
  own.D = next;
  if (active === own) { D = next; index(); }
  for (const g of next.groups) if (g.collapsed && !known.has(g.path)) state.collapsed.add(g.path);     // new groups as declared
  header();
  buildLegend();
  buildGroupsMenu();
  viewSwitch();
  if (rs.view === "results") { renderResults(); showResultDetail(); } else showDetail(state.sel);
  render(false, true, new Set([...changed].map((k) => k.replace(/^G:/, "g:"))));
  const parts = [changed.size && `${changed.size} changed`, added && `${added} added`, removed && `${removed} removed`].filter(Boolean);
  note(`Rebuilt: ${parts.join(", ") || "no change to the graph"}${D.check.errors.length ? " · check errors" : ""}`);
}
function live() {
  let version = D.version;                          // the build this page holds
  const events = new EventSource("events");
  events.onmessage = async (e) => {
    const st = JSON.parse(e.data);
    $("live")?.classList.replace("off", "on");
    if (st.version === version) return;
    version = st.version;
    if (!st.ok) { header(st.error); note("Rebuild failed: see above"); return; }
    update(await (await fetch("data.json", {cache: "no-store"})).json());
  };
  events.onerror = () => { $("live")?.classList.replace("on", "off"); if ($("live")) $("live").title = "the server is not answering"; };
}

header();
buildLegend();
buildGroupsMenu();
laneBar();
viewSwitch();
showDetail(null);
if (D.live && location.protocol.startsWith("http")) live();
render(true).then(() => { if (rs.view === "results" && hasResults()) setView("results"); else if (LANES.length > 1) showDetail(state.sel); }).catch((e) => { console.error(e); $("vp").innerHTML = `<text x="10" y="20" fill="red">${esc(e)}</text>`; });
</script>
<script>
libWire();
if (D) { const main = document.createElement("script"); main.textContent = $("viewer-main").textContent; document.body.append(main); }
else openLibrary(true);
</script>
</body>
