[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "headway"
version = "0.2.0"
description = "Compare computational graphs and benchmarking results for methods development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Skubi", email = "bskubi@gmail.com" }]
keywords = ["computation graph", "notation", "equations", "scientific computing", "benchmarking", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/bskubi/headway"
Guide = "https://github.com/bskubi/headway/blob/main/src/headway/GUIDE.md"
Issues = "https://github.com/bskubi/headway/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
headway = "headway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
headway = ["viewer.html", "GUIDE.md"]
